
<section class="booking-page">
  <div class="booking-heading">
    <p class="eyebrow">YOUR NEXT ADVENTURE STARTS HERE</p>
    <h1>Book Your Dream Trip ✈️</h1>
    <p>Tell us your travel plans, and we'll help you make them unforgettable.</p>
  </div>

  <form class="booking-form" (submit)="submitBooking($event)">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text"
          placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email"
          placeholder="Enter your email" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel"
          placeholder="Enter your phone number"
          pattern="[0-9]{10}" maxlength="10" required>
      </div>

      <div class="form-group">
        <label for="destination">Choose Destination</label>
        <select id="destination" name="destination" required>
          <option value="">Select a destination</option>
          <option value="Goa">Goa</option>
          <option value="Manali">Manali</option>
          <option value="Jaipur">Jaipur</option>
          <option value="Kerala">Kerala</option>
          <option value="Kashmir">Kashmir</option>
          <option value="Agra">Agra</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="date">Travel Date</label>
        <input id="date" name="date" type="date" required>
      </div>

      <div class="form-group">
        <label for="travelers">Number of Travelers</label>
        <input id="travelers" name="travelers"
          type="number" min="1" max="50" value="1" required>
      </div>
    </div>

    <div class="form-group">
      <label for="message">Additional Requirements</label>
      <textarea id="message" name="requirements" rows="4"
        placeholder="Tell us about your travel preferences"></textarea>
    </div>

    <button type="submit" class="submit-btn" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Submitting...' : 'Submit Booking Request →' }}
    </button>

    <p class="success-message" [hidden]="!successMessage">
      {{ successMessage }}
    </p>

    <p class="error-message" [hidden]="!errorMessage">
      {{ errorMessage }}
    </p>
  </form>
</section>
